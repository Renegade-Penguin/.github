version: 2
updates:
  # Every action is pinned to a commit with a version comment; Dependabot
  # reads the comment and moves both together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # A malicious release is usually pulled within days; waiting a week
    # before proposing it costs nothing.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, github-actions]
